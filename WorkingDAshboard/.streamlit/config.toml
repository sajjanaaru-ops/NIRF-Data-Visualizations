[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#f0f0f4"
textColor = "#1d1d1f"
linkColor = "#0066cc"
linkUnderline = false
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFontWeights = [700, 700, 650, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "full"
borderColor = "#e3e3e8"
showWidgetBorder = true
chartCategoricalColors = ["#0071e3", "#34c759", "#ff9f0a", "#af52de", "#ff375f", "#5ac8fa", "#ffcc00", "#8e8e93"]

[client]
toolbarMode = "minimal"

[server]
headless = true
